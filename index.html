<head>

<title>Pré‑visualização Página</title>
<style>
/* Animações do carrossel */
@keyframes moveLeft {
    from {transform: translateX(100%);}
    to {transform: translateX(0);}
}
@keyframes moveLeftActive {
    from {transform: translateX(0);}
    to {transform: translateX(-100%);}
}
@keyframes moveRight {
    from {transform: translateX(-100%);}
    to {transform: translateX(0);}
}
@keyframes moveRightActive {
    from {transform: translateX(0);}
    to {transform: translateX(100%);}
}

.component-slider {
    --footer-gap: 8px;
    --item-button-height: 3px;
    --toggle-button-width: 24px;
    width:100%;
    max-width:1100px;
    margin:0 auto 40px;
}
.component-slider .carousel {
    position: relative;
    height:320px;
    overflow:hidden;
    background:#222;
}
.component-slider .carousel-caption {
    left: 25%;
    right: 25%;
    color:white;
    text-align:center;
    top:40%;
}
.component-slider .carousel-item {
    opacity: 0;
    position:absolute;
    width:100%;
    height:100%;
    top:0;
    left:0;
}
.component-slider .carousel-item.move-right,
.component-slider .carousel-item.move-left {
    animation-duration: 0.6s;
    animation-iteration-count: 1;
    display: block;
}
.component-slider .carousel-item.active,
.component-slider .carousel-item.move-left,
.component-slider .carousel-item.move-right {
    opacity: 1;
}
.component-slider .carousel-item.active {
    transform: translateX(0);
}
.component-slider .carousel-item.active.move-left {
    animation-name: moveLeftActive;
}
.component-slider .carousel-item.move-left {
    animation-name: moveLeft;
}
.component-slider .carousel-item.active.move-right {
    animation-name: moveRightActive;
}
.component-slider .carousel-item.move-right {
    animation-name: moveRight;
}
.component-slider .carousel-control-next,
.component-slider .carousel-control-prev {
    background-color: rgba(255,255,255,0.2);
    border: 0;
    color:white;
    font-size:22px;
    cursor:pointer;
}
.component-slider .carousel-control {
    bottom: auto;
    height: auto;
    padding: 8px;
    top: 50%;
    transform: translateY(-50%);
    width: auto;
    z-index:10;
}
.component-slider .carousel-control-next {
    right: 5%;
}
.component-slider .carousel-control-prev {
    left: 5%;
}
.component-slider .carousel-control:focus-visible {
    border-radius: 4px;
    box-shadow:0 0 0 2px #fff,0 0 0 4px #528eff;
    outline: none;
}
.component-slider .carousel-footer {
    bottom: 10px;
    display: flex;
    gap: var(--footer-gap);
    justify-content: center;
    left: 0;
    padding-left: 0;
    position: absolute;
    right: 0;
    width: calc(100% - var(--toggle-button-width) - var(--footer-gap));
    z-index: 15;
}
.component-slider .carousel-navigation {
    display: flex;
    gap: var(--footer-gap);
    justify-content: center;
    list-style: none;
    margin: 0;
    padding: 0;
}
.component-slider .carousel-item-button {
    background: transparent;
    border: 0;
    display: block;
    outline: 0;
    padding: calc((var(--toggle-button-width) - var(--item-button-height)) / 2) 0;
    text-decoration: none;
    cursor:pointer;
}
.component-slider .carousel-item-button:focus-visible {
    border-radius: 4px;
    box-shadow:0 0 0 2px #fff,0 0 0 4px #528eff;
    outline: none;
}
.component-slider .carousel-item-button-icon {
    background-color: rgba(255, 255, 255, 0.5);
    display: block;
    height: var(--item-button-height);
    width: 30px;
}
.component-slider .carousel-item-button.active .carousel-item-button-icon {
    background-color: rgba(255, 255, 255, 1);
}
.component-slider .carousel-toggle-button {
    aspect-ratio: 1 / 1;
    background: rgba(255,255,255,0.2);
    border: none;
    color: rgba(255, 255, 255, 1);
    display: block;
    height: var(--toggle-button-width);
    opacity: 0;
    transition: opacity ease 0.6s;
    width: var(--toggle-button-width);
    cursor:pointer;
}
.component-slider .carousel-toggle-button--always-visible,
.component-slider .carousel-toggle-button.stopped,
.component-slider .carousel-toggle-button:focus-visible,
.component-slider .component-slider:hover .carousel-toggle-button {
    opacity: 1;
}
.component-slider .carousel-toggle-button:focus-visible {
    border-radius: 4px;
    box-shadow:0 0 0 2px #fff,0 0 0 4px #528eff;
    opacity: 1;
    outline: none;
}

/* Menu Acesso Rápido */
.menuAcessoRapido{

    color:#444;
}
</style>

<script type="module" >
const configuration = {"autoHidePlayButton":true,"numberOfSlides":3};
const fragmentElement = document.querySelector('#fragment-f074b617-103c-6d2d-9efd-b401cd9ae042');
const fragmentEntryLinkNamespace = 'xwlo';
const layoutMode = 'view';
const INTERVAL = 5000;
const MOVE_LEFT = 'move-left';
const MOVE_RIGHT = 'move-right';

const editMode = layoutMode === 'edit';

const carouselInner = fragmentElement.querySelector('.carousel-inner');
const indicators = [].slice.call(fragmentElement.querySelectorAll('.carousel-item-button'));
const items = [].slice.call(fragmentElement.querySelectorAll('.carousel-item'));
const next = fragmentElement.querySelector('.carousel-control-next');
const nextItemIndexKey = `${fragmentEntryLinkNamespace}-next-item-index`;
const prev = fragmentElement.querySelector('.carousel-control-prev');
const toggleButton = fragmentElement.querySelector('.carousel-toggle-button');
const toggleButtonIconStart = fragmentElement.querySelector('.carousel-toggle-icon-start');
const toggleButtonIconStop = fragmentElement.querySelector('.carousel-toggle-icon-stop');
const toggleButtonText = fragmentElement.querySelector('.carousel-toggle-text');
let intervalId = null;
let moving = false;

function activateIndicator(activeItem, nextItem, movement) {
    if (movement) {
        activeItem.classList.add(movement);
        nextItem.classList.add(movement);
    }
    const activeIndicator = getActiveIndicator();
    const nextIndicator = indicators[getNextItemIndex()];
    if(activeIndicator){
        activeIndicator.classList.remove('active');
        activeIndicator.setAttribute('aria-current', 'false');
    }
    if(nextIndicator){
        nextIndicator.classList.add('active');
        nextIndicator.setAttribute('aria-current', 'true');
    }
}
function activateItem(activeItem, nextItem, movement) {
    activeItem.classList.remove('active');
    nextItem.classList.add('active');
    if (movement) {
        activeItem.classList.remove(movement);
        nextItem.classList.remove(movement);
    }
}
function getActiveIndicator() {
    return fragmentElement.querySelector('.carousel-item-button.active');
}
function getNextItemIndex() {
    return window[nextItemIndexKey] || 0;
}
function move(movement, index = null) {
    if (moving) return;
    moving = true;
    const activeItem = fragmentElement.querySelector('.carousel-item.active');
    const indexActiveItem = items.indexOf(activeItem);
    setNextItemIndex(indexActiveItem < 1 ? items.length - 1 : indexActiveItem - 1);
    if (index !== null) setNextItemIndex(index);
    else if (movement === MOVE_RIGHT) setNextItemIndex(indexActiveItem >= items.length - 1 ? 0 : indexActiveItem + 1);
    const nextItem = items[getNextItemIndex()];
    activateIndicator(activeItem, nextItem, movement);
    setTimeout(function () {
        activateItem(activeItem, nextItem, movement);
        moving = false;
    }, 600);
}
function startCarousel() {
    if (intervalId) clearInterval(intervalId);
    intervalId = setInterval(function () {
        if (document.contains(items[0])) move(MOVE_RIGHT);
        else stopCarousel();
    }, INTERVAL);
    carouselInner.setAttribute('aria-live', 'off');
    if(toggleButton){
        toggleButton.classList.add('playing');
        toggleButton.classList.remove('stopped');
    }
    if(toggleButtonIconStart) toggleButtonIconStart.classList.add('d-none');
    if(toggleButtonIconStop) toggleButtonIconStop.classList.remove('d-none');
    if(toggleButtonText) toggleButtonText.textContent = 'Stop slide rotation';
}
function stopCarousel() {
    if (intervalId) {
        clearInterval(intervalId);
        intervalId = null;
        carouselInner.setAttribute('aria-live', 'polite');
        if(toggleButton){
            toggleButton.classList.remove('playing');
            toggleButton.classList.add('stopped');
        }
        if(toggleButtonIconStart) toggleButtonIconStart.classList.remove('d-none');
        if(toggleButtonIconStop) toggleButtonIconStop.classList.add('d-none');
        if(toggleButtonText) toggleButtonText.textContent = 'Start slide rotation';
    }
}
function setNextItemIndex(index) {
    window[nextItemIndexKey] = index;
}

(function () {
    if (!editMode) startCarousel();
    if (getNextItemIndex() < items.length) {
        const activeItem = fragmentElement.querySelector('.carousel-item.active');
        const nextItem = items[getNextItemIndex()];
        activateIndicator(activeItem, nextItem);
        activateItem(activeItem, nextItem);
    }
    if(prev) prev.addEventListener('click', function () { stopCarousel(); move(MOVE_LEFT); });
    if(next) next.addEventListener('click', () => { stopCarousel(); move(MOVE_RIGHT); });
    if(toggleButton) toggleButton.addEventListener('click', () => {
        if (toggleButton.classList.contains('playing')) stopCarousel();
        else startCarousel();
    });
    indicators.forEach(function (indicator, index) {
        indicator.addEventListener('click', function () {
            const indexActiveIndicator =
